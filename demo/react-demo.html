<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Demo - Text & Media Component</title>
  <!-- Development only - Use precompiled scripts in production -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <link rel="stylesheet" href="../text-media.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .demo-section {
      margin-bottom: 3rem;
      padding: 2rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .demo-section h2 {
      margin-top: 0;
      color: #1e40af;
    }
    .text-media__image {
      position: relative;
      overflow: hidden;
    }
    .text-media__image picture {
      position: relative;
      display: block;
      width: 100%;
    }
    .text-media__image img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const ReactDemo = () => {
      return (
        <div>
          <h1>React Demo for Text & Media Component</h1>
          
          {/* Basic Example */}
          <div className="demo-section">
            <h2>Basic Example</h2>
            <div className="text-media">
              <div className="text-media__text">
                <h2>Welcome to Text & Media</h2>
                <p>This is a basic example of the Text & Media component. It combines text content with media elements in a responsive layout.</p>
              </div>
              <div className="text-media__image">
                <picture>
                  <img 
                    src="https://placehold.co/800x600/2563eb/ffffff?text=Basic+Example" 
                    alt="Basic Example" 
                    width="800"
                    height="600"
                  />
                </picture>
              </div>
            </div>
          </div>

          {/* Stacked Layout */}
          <div className="demo-section">
            <h2>Stacked Layout</h2>
            <div className="text-media text-media--stacked">
              <div className="text-media__text">
                <h2>Stacked Layout</h2>
                <p>The text-media--stacked class arranges content vertically, with text above the media on larger screens.</p>
              </div>
              <div className="text-media__image">
                <picture>
                  <img 
                    src="https://placehold.co/800x600/3b82f6/ffffff?text=Stacked+Layout" 
                    alt="Stacked Layout" 
                    width="800"
                    height="600"
                  />
                </picture>
              </div>
            </div>
          </div>

          {/* Dark Theme */}
          <div className="demo-section">
            <h2>Dark Theme</h2>
            <div className="text-media theme-dark">
              <div className="text-media__text">
                <h2>Dark Theme</h2>
                <p>The theme-dark class applies a dark color scheme to the component.</p>
              </div>
              <div className="text-media__image">
                <picture>
                  <img 
                    src="https://placehold.co/800x600/1f2937/ffffff?text=Dark+Theme" 
                    alt="Dark Theme" 
                    width="800"
                    height="600"
                  />
                </picture>
              </div>
            </div>
          </div>

          {/* Purple Background */}
          <div className="demo-section">
            <h2>Purple Background</h2>
            <div className="text-media text-media--purple-background">
              <div className="text-media__text">
                <h2>Purple Background</h2>
                <p>The text-media--purple-background class adds a purple background to the component.</p>
              </div>
              <div className="text-media__image">
                <picture>
                  <img 
                    src="https://placehold.co/800x600/7c3aed/ffffff?text=Purple+Background" 
                    alt="Purple Background" 
                    width="800"
                    height="600"
                  />
                </picture>
              </div>
            </div>
          </div>

          {/* Contained Width */}
          <div className="demo-section">
            <h2>Contained Width</h2>
            <div className="text-media text-media--contain">
              <div className="text-media__text">
                <h2>Contained Width</h2>
                <p>The text-media--contain class limits the width of the component to the page width.</p>
              </div>
              <div className="text-media__image">
                <picture>
                  <img 
                    src="https://placehold.co/800x600/4f46e5/ffffff?text=Contained+Width" 
                    alt="Contained Width" 
                    width="800"
                    height="600"
                  />
                </picture>
              </div>
            </div>
          </div>

          {/* Two Columns Text */}
          <div className="demo-section">
            <h2>Two Columns Text</h2>
            <div className="text-media text-media--two-columns">
              <div className="text-media__text">
                <h2>Two Columns Text</h2>
                <p>The text-media--two-columns class arranges text content in two columns on larger screens. This is useful for longer text content that needs to be more readable.</p>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
              </div>
              <div className="text-media__image">
                <picture>
                  <img 
                    src="https://placehold.co/800x600/2563eb/ffffff?text=Two+Columns" 
                    alt="Two Columns" 
                    width="800"
                    height="600"
                  />
                </picture>
              </div>
            </div>
          </div>

          {/* White Box */}
          <div className="demo-section">
            <h2>White Box</h2>
            <div className="text-media text-media--white-box">
              <div className="text-media__text">
                <h2>White Box</h2>
                <p>The text-media--white-box class adds a white background to the text content, making it stand out against any background.</p>
              </div>
              <div className="text-media__image">
                <picture>
                  <img 
                    src="https://placehold.co/800x600/1e40af/ffffff?text=White+Box" 
                    alt="White Box" 
                    width="800"
                    height="600"
                  />
                </picture>
              </div>
            </div>
          </div>

          {/* Checkerboard Pattern */}
          <div className="demo-section">
            <h2>Checkerboard Pattern</h2>
            <div className="text-media text-media--checkerboard">
              <div className="text-media__text">
                <h2>Checkerboard Pattern</h2>
                <p>The text-media--checkerboard class creates an alternating pattern of text and media sections.</p>
              </div>
              <div className="text-media__image">
                <picture>
                  <img 
                    src="https://placehold.co/800x600/3b82f6/ffffff?text=Checkerboard" 
                    alt="Checkerboard" 
                    width="800"
                    height="600"
                  />
                </picture>
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<ReactDemo />, document.getElementById('root'));
  </script>
</body>
</html>
