    <h1>Text & Media React Demo (<a href="https://github.com/radogado/text-media">Source</a>)</h1>

    <div id="root"></div>

    <script type="text/babel" src="text-media.jsx"></script>
    <script type="text/babel">
      const { TextMedia, TextMediaText, TextMediaImage, TextMediaBackground } = window;

      function DemoSection({ title, code, children }) {
        return (
          <section className="text-media">
            <TextMediaText>
              <h2>{title}</h2>
              <div className="code">
                <pre className="language-markup">
                  <code className="language-markup">{code}</code>
                </pre>
              </div>
            </TextMediaText>
            {children}
          </section>
        );
      }

      function App() {
        return (
          <React.Fragment>
            {/* Default */}
            <DemoSection 
              title="Default"
              code={`<TextMedia>
  <TextMediaText>
    <div></div>
  </TextMediaText>

  <TextMediaImage>
    <picture></picture>
  </TextMediaImage>
</TextMedia>`}
            >
              <TextMediaImage>
                <figure>
                  <picture style={{'--placeholder': "url('../images/mobile-app-iphone-1-placeholder.png')"}}>
                    <img src="../images/mobile-app-iphone-1.webp" width="480" height="677.5" alt="1" />
                  </picture>
                  <figcaption>Caption</figcaption>
                </figure>
              </TextMediaImage>
            </DemoSection>

            {/* Alignment */}
            <DemoSection 
              title="Alignment"
              code={`<TextMediaText align="center">Center</TextMediaText>
<TextMediaText align="right">Right</TextMediaText>
<TextMediaText align="middle">Middle</TextMediaText>
<TextMediaText align="bottom">Bottom</TextMediaText>`}
            >
              <TextMediaText>
                <p>
                  To align content, use one of the following classes on the
                  <b>.text-media__text</b> and/or <b>.text-media__image</b> elements. Default is top/start.
                </p>
              </TextMediaText>
              <TextMediaText>
                <p>Horizontal: <b>.align-center</b>, <b>.align-right</b>.</p>
                <p>Vertical: <b>.align-middle</b>, <b>.align-bottom</b>.</p>
              </TextMediaText>
            </DemoSection>

            {/* Colors */}
            <DemoSection 
              title="Colors"
              code={`<TextMedia theme="dark">
  <TextMediaText>
    <div></div>
  </TextMediaText>
</TextMedia>`}
            >
              <TextMediaText>
                <p>Color options by CSS variables:</p>
                <div className="code">
                  <pre className="language-markup">
                    <code className="language-markup">{`.text-media {
  --bg: #eee;
  --color: #333;
  --bg-dark-mode: #333;
  --color-dark-mode: #eee;
}`}</code>
                  </pre>
                </div>
                <p>Themes: <b>.theme-light</b>, <b>.theme-white</b>, <b>.theme-dark</b>.</p>
              </TextMediaText>
              <TextMediaText>
                <p>Optionally, padding can be specified by <b>--padding-x</b>, <b>--padding-y</b>.</p>
